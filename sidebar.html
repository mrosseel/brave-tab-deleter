<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Deleter</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="sidebar-header">
    <div class="header-normal" id="header-normal">
      <div class="header-left">
        <span class="header-title">Tabs</span>
        <span id="tab-count" class="header-count"></span>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="search-btn" title="Search tabs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
        </button>
        <button class="header-btn" id="collapse-all-btn" title="Collapse all groups">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12h16"></path>
            <path d="M12 4v4"></path>
            <path d="M12 16v4"></path>
          </svg>
        </button>
        <button class="header-btn" id="expand-all-btn" title="Expand all groups">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
          </svg>
        </button>
        <button class="header-btn" id="settings-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="header-search" id="header-search">
      <input type="text" id="search-input" placeholder="Search tabs..." autocomplete="off">
      <button class="header-btn" id="search-clear-btn" title="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18"></path>
          <path d="M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </header>
  <div id="tab-list"></div>

  <!-- Context menu -->
  <div id="context-menu" class="context-menu">
    <div class="context-menu-item" data-action="new-tab">New tab</div>
    <div class="context-menu-item" data-action="duplicate">Duplicate</div>
    <div class="context-menu-item" data-action="close">Close</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item context-menu-has-submenu" data-action="move-to-group">
      Move to group
      <span class="submenu-arrow">▶</span>
      <div class="context-submenu" id="move-to-group-submenu"></div>
    </div>
    <div class="context-menu-item" data-action="ungroup" id="ungroup-option">Ungroup</div>
  </div>

  <script src="dist/sidebar.js"></script>
</body>
</html>
